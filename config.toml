# serene v6.0.0
#
# - docs: https://github.com/isunjn/serene/blob/latest/USAGE.md
# - check for updates: https://github.com/isunjn/serene/releases
#
#=========================================================================================

base_url = "https://djan.org"      # Domain name of your website
title = "djan.org"
description = "structure admirer djan"
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = true
build_search_index = false            # Keep this false, search is temporarily unsupported
generate_feeds = true
feed_filenames = [ "atom.xml" ]             # The file name of feed, "feed.xml" / "atom.xml" / "rss.xml", read docs for more info
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================

[extra]
reaction = false
color_scheme = "auto"
back_link_text = "Back" # Text of the back button
avatar = "img/avatar.gif"
name = "Jonathan Strickland"
handle = "djanatyn"
bio = "curious hacker | they/them"
links = [
    { name = "GitHub", icon = "github", url = "https://github.com/djanatyn" },
    { name = "Email", icon = "email", url = "mailto:djanatyn@gmail.com" },
]

homepage_layout = "about"             # "about" | "list"

nav = [
    { name = "blog", path = "/blog" },
    { name = "github", path = "https://github.com/djanatyn" },
    { name = "ogs", path = "https://online-go.com/user/view/435842" },
    { name = "last.fm", path = "https://www.last.fm/user/djanatyn" },
    { name = "steam", path = "https://steamcommunity.com/id/djanatyn" },
]
blog_section_path = "/blog"

nav_separator = "::"
nav_wrapper_left = "{"
nav_wrapper_right = "} ;"
nav_wrapper_separator = ","

date_format = "%b %-d, %Y"
outdated_alert = false
outdated_alert_days = 120
outdated_alert_text_before = "This article was last updated "
outdated_alert_text_after = " days ago and may be out of date."

footer_copyright = "by djan"
footer_credits = true                 # Whether to show "powered by zola and serene" in footer

not_found_title = "404"
not_found_error_text = "Not Found"
not_found_recover_text = "« back to home »"
